name: Build AltStudio.app IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build IPA
        run: ./scripts/build-ipa.sh

      - name: Prepare IPA artifact
        run: ./scripts/prepare-artifact.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          path: build/artifacts/Source_Editor.ipa
          if-no-files-found: error
          archive: false
