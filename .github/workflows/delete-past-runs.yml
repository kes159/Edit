name: Delete past runs and releases

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: delete-past-runs-and-releases
  cancel-in-progress: false

jobs:
  delete-past-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete completed runs, releases, and release tags
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            const { owner, repo } = context.repo;
            const [runs, releases] = await Promise.all([
              github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner,
                repo,
                per_page: 100
              }),
              github.paginate(github.rest.repos.listReleases, {
                owner,
                repo,
                per_page: 100
              })
            ]);
            const pastRuns = runs.filter(run =>
              run.id !== context.runId && run.status === 'completed'
            );

            let deletedRuns = 0;
            let deletedReleases = 0;
            let deletedTags = 0;
            let missingTags = 0;
            const failures = [];
            for (const run of pastRuns) {
              try {
                await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id });
                deletedRuns += 1;
              } catch (error) {
                failures.push(`Run ${run.id}: ${error.message}`);
                core.warning(`Could not delete run ${run.id}: ${error.message}`);
              }
            }

            for (const release of releases) {
              try {
                await github.rest.repos.deleteRelease({ owner, repo, release_id: release.id });
                deletedReleases += 1;
              } catch (error) {
                failures.push(`Release ${release.id}: ${error.message}`);
                core.warning(`Could not delete release ${release.id}: ${error.message}`);
                continue;
              }

              if (!release.tag_name) continue;
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `tags/${release.tag_name}` });
                deletedTags += 1;
              } catch (error) {
                if (error.status === 404) {
                  missingTags += 1;
                } else {
                  failures.push(`Tag ${release.tag_name}: ${error.message}`);
                  core.warning(`Could not delete tag ${release.tag_name}: ${error.message}`);
                }
              }
            }

            await core.summary
              .addHeading('Cleanup results')
              .addRaw(`- Completed workflow runs deleted: ${deletedRuns}\n- Releases deleted: ${deletedReleases}\n- Release tags deleted: ${deletedTags}\n- Tags already missing: ${missingTags}\n- Failed deletions: ${failures.length}\n\nThis cleanup run remains visible.`)
              .write();
            if (failures.length) {
              core.setFailed(`${failures.length} deletion(s) failed. See the warnings above.`);
            }
